set -g message-style "fg=#5a93aa,bg=#cbd9d8"
set -g message-command-style "fg=#5a93aa,bg=#cbd9d8"
set -g pane-border-style "fg=#cbd9d8"
set -g pane-active-border-style "fg=#5a93aa"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#5a93aa,bg=#0f1c1e"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#2f3239,bg=#5a93aa,bold] #S #[fg=#5a93aa,bg=#0f1c1e,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#0f1c1e,bg=#0f1c1e,nobold,nounderscore,noitalics]#[fg=#5a93aa,bg=#0f1c1e] #{prefix_highlight} #[fg=#cbd9d8,bg=#0f1c1e,nobold,nounderscore,noitalics]#[fg=#5a93aa,bg=#cbd9d8] %Y-%m-%d  %I:%M %p #[fg=#5a93aa,bg=#cbd9d8,nobold,nounderscore,noitalics]#[fg=#2f3239,bg=#5a93aa,bold] #h "
setw -g window-status-activity-style "underscore,fg=#587b7b,bg=#0f1c1e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#587b7b,bg=#0f1c1e"
setw -g window-status-format "#[fg=#0f1c1e]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]#{?#{==:#{@park},1},#[fg=#384c4c]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]⏸ #I  #W#{?window_flags, #F,},#{?#{==:#{@park},auto},#[fg=#a65c3d]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]◌ #I  #W#{?window_flags, #F,},#{?#{==:#{@claude-state},running},#[fg=#5a93aa]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]#{@claude-spinner} #I  #W#{?window_flags, #F,},#{?#{==:#{@claude-state},input},#[fg=#ffcc66]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]? #I  #W#{?window_flags, #F,},#{?#{==:#{@claude-state},permission},#[fg=#e85c51]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]! #I  #W#{?window_flags, #F,},#{?#{==:#{@claude-state},done},#[fg=#7aa4a1]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]✓ #I  #W#{?window_flags, #F,},#[fg=#587b7b]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]  #I  #W#{?window_flags, #F,}}}}}}}#[fg=#0f1c1e]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]  "
