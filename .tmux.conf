# Nightfox colors for Tmux
# Style: terafox
# Upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/terafox/nightfox_tmux.tmux
set -g mode-style "fg=#5a93aa,bg=#cbd9d8"
set -g message-style "fg=#5a93aa,bg=#cbd9d8"
set -g message-command-style "fg=#5a93aa,bg=#cbd9d8"
set -g pane-border-style "fg=#cbd9d8"
set -g pane-active-border-style "fg=#5a93aa"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#5a93aa,bg=#0f1c1e"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#2f3239,bg=#5a93aa,bold] #S #[fg=#5a93aa,bg=#0f1c1e,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#0f1c1e,bg=#0f1c1e,nobold,nounderscore,noitalics]#[fg=#5a93aa,bg=#0f1c1e] #{prefix_highlight} #[fg=#cbd9d8,bg=#0f1c1e,nobold,nounderscore,noitalics]#[fg=#5a93aa,bg=#cbd9d8] %Y-%m-%d  %I:%M %p #[fg=#5a93aa,bg=#cbd9d8,nobold,nounderscore,noitalics]#[fg=#2f3239,bg=#5a93aa,bold] #h "
setw -g window-status-activity-style "underscore,fg=#587b7b,bg=#0f1c1e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#587b7b,bg=#0f1c1e"
setw -g window-status-format "#[fg=#0f1c1e]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]#{?#{==:#{@park},1},#[fg=#4a5a5a]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]⏸ #I  #W #F ,#{?#{==:#{@park},auto},#[fg=#a8845c]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]◌ #I  #W #F ,#{?#{==:#{@claude-state},running},#[fg=#5a93aa]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]#{@claude-spinner} #I  #W #F ,#{?#{==:#{@claude-state},input},#[fg=#e6b87b]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]? #I  #W #F ,#{?#{==:#{@claude-state},permission},#[fg=#e85c51]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]! #I  #W #F ,#{?#{==:#{@claude-state},done},#[fg=#7aa4a1]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]✓ #I  #W #F ,#[fg=#587b7b]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]  #I  #W #F }}}}}}#[fg=#0f1c1e]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]"
setw -g window-status-current-format "#[fg=#0f1c1e]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]#{?#{==:#{@park},1},#[fg=#6d7f7f]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]⏸ #I  #W #F ,#{?#{==:#{@park},auto},#[fg=#c99a63]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]◌ #I  #W #F ,#{?#{==:#{@claude-state},running},#[fg=#5a93aa]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]#{@claude-spinner} #I  #W #F ,#{?#{==:#{@claude-state},input},#[fg=#e6b87b]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]? #I  #W #F ,#{?#{==:#{@claude-state},permission},#[fg=#e85c51]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]! #I  #W #F ,#{?#{==:#{@claude-state},done},#[fg=#7aa4a1]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]✓ #I  #W #F ,#[fg=#5a93aa]#[bg=#0f1c1e]#[bold]#[nounderscore]#[noitalics]  #I  #W #F }}}}}}#[fg=#0f1c1e]#[bg=#0f1c1e]#[nobold]#[nounderscore]#[noitalics]"


# status-left
set-window-option -g status-left " #S "
# status-right
set -g status-right-length 150

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# enable mouse to resize
set-option -g mouse on

# set escape button time needed to 0
set escape-time 0

set -g status-interval 1
set-option -g status on

# enable wm window titles
set -g set-titles on

# disable auto renaming
set -g automatic-rename on

# disable auto renumbering
set-option -g renumber-windows on

# more history
set-option -g history-limit 50000

# KEYS
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"

# dont mess up with other ctrl-a options by pressing ctrl-a twice
bind C-a send-prefix

# remap copy paste keys
unbind [
bind y copy-mode
unbind p
bind p paste-buffer

# Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi r send -X rectangle-toggle

# Copy through pbcopy instead of OSC 52: with set-clipboard external, tmux hands
# copies to Alacritty, whose NSPasteboard write races with clipboard managers and
# intermittently drops the copy with a "writeObjects: returned false" warning.
# copy-command makes the default mouse bindings (drag-end, double-click word)
# pipe to pbcopy as well.
set -s set-clipboard off
set -g copy-command "pbcopy"

# copy to system clipboard
bind C-c run "tmux save-buffer - | pbcopy"

# paste from system clipboard
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# remaps for splits
bind '\' split-window -h -c "#{pane_current_path}"
bind '|' split-window -hb -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '_' split-window -vb -c "#{pane_current_path}"
unbind '"'
unbind %

# new windows/panes in same directory
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move around panes with hjkl (same as arrows)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use shift + arrow key to move between windows in a session
bind -n S-Left  previous-window
bind -n S-Right next-window

# resizes, down, up, left, right
bind D resize-pane -D 4
bind U resize-pane -U 4
bind L resize-pane -L 4
bind R resize-pane -R 4

# search
bind-key / copy-mode \; send-key ?

set-window-option -g status-right '#($HOME/projects/spotify-tmux-applescript/bin/spotify_artist_and_track.applescript) %d/%m/%y %H:%M'

#### PARK — defer a window instead of renaming it
# State lives in the @park window option, never in the window name, so the badge
# survives automatic-rename and the parked windows can be sorted to the right.
# Engine: ~/.config/tmux/scripts/tmux-park.sh (rendering is in the two
# window-status formats above).

# tmux.conf is not a shell, so there is no way to alias the path — but the
# command strings below are handed to sh by run-shell/display-popup, which is
# what expands $HOME.

bind P run-shell "$HOME/.config/tmux/scripts/tmux-park.sh toggle '#{session_name}' '#{window_id}'"
bind N command-prompt -p "park note:" "run-shell \"$HOME/.config/tmux/scripts/tmux-park.sh note '#{session_name}' '#{window_id}' '%%'\""
# Native tmux menu, not fzf in a popup: tmux draws it and eats the keystrokes
# itself. With mouse on and focus-events on, the terminal's own escape sequences
# reached fzf inside display-popup and read as movement-plus-accept, so the popup
# appeared to close the instant it opened. prefix + C-f still gets the fzf
# version when the parked list is long enough to want fuzzy matching.
bind F run-shell "$HOME/.config/tmux/scripts/tmux-park.sh menu '#{session_name}' '#{client_tty}'"
bind C-f display-popup -E -w 80% -h 60% "$HOME/.config/tmux/scripts/tmux-park.sh picker '#{session_name}'"
bind O run-shell "$HOME/.config/tmux/scripts/tmux-park.sh sort '#{session_name}'"

# Attention stamps feed the stale detector, and looking at an auto-parked window
# is the same as resuming it — the badge clears itself.
#
# session-window-changed rather than after-select-window: next-window and
# previous-window (S-Left / S-Right above) have no after-* hooks at all, so
# hooking the command would miss most of the ways you actually change window.
set-hook -g session-window-changed "run-shell -b \"$HOME/.config/tmux/scripts/tmux-park.sh touch '#{session_name}' '#{window_id}'\""

# Auto-park windows that have gone quiet. Tunables:
#   @park-stale-mins      minutes of quiet before auto-parking  (0 disables)
#   @park-stale-interval  seconds between sweeps
#   @park-dwell-secs      seconds in a window before a visit counts as attention
#                         (0 = every visit counts, which makes cycling sideways
#                          through windows reset every idle clock it passes)
# Opt one window out for good with:  tmux set -w @park-never 1
set -g @park-stale-mins 45
set -g @park-dwell-secs 30
set -g @park-stale-interval 60
run-shell -b "$HOME/.config/tmux/scripts/tmux-stale.sh start"
