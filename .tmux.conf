# status-left
set-window-option -g status-left " #S "
# status-right
set -g status-right-length 150

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1   #? tmux  move this window left
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1   #? tmux  move this window right

# enable mouse to resize
set-option -g mouse on

# set escape button time needed to 0
set escape-time 0

set -g status-interval 1
set-option -g status on

# enable wm window titles
set -g set-titles on

# disable auto renaming
set -g automatic-rename on

# disable auto renumbering
set-option -g renumber-windows on

# more history
set-option -g history-limit 50000

# KEYS
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"   #? tmux  reload this config

# dont mess up with other ctrl-a options by pressing ctrl-a twice
bind C-a send-prefix

# remap copy paste keys
unbind [
bind y copy-mode   #? tmux  enter copy mode
bind u display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmux-urls"   #? tmux  pick url from pane, open in terminal-browser
# Ghostty turns cmd+v into a C-v byte (see ghostty config). Shell panes want a
# text paste out of that; anything else — claude (images), vim (visual block) —
# gets the byte untouched.
bind -n C-v if -F '#{m:*sh,#{pane_current_command}}' 'run-shell "$HOME/.local/bin/tmux-paste-text"' 'send-keys C-v'   #? tmux  cmd+v pastes anywhere, images included in claude
unbind p
bind p paste-buffer   #? tmux  paste the tmux buffer

# Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi r send -X rectangle-toggle

# Copy through pbcopy instead of OSC 52: with set-clipboard external, tmux hands
# copies to Alacritty, whose NSPasteboard write races with clipboard managers and
# intermittently drops the copy with a "writeObjects: returned false" warning.
# copy-command makes the default mouse bindings (drag-end, double-click word)
# pipe to pbcopy as well.
set -s set-clipboard off
set -g copy-command "pbcopy"

# copy to system clipboard
bind C-c run "tmux save-buffer - | pbcopy"   #? tmux  copy buffer to the system clipboard

# paste from system clipboard
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"   #? tmux  paste from the system clipboard

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# remaps for splits
bind '\' split-window -h -c "#{pane_current_path}"   #? tmux  split right
bind '|' split-window -hb -c "#{pane_current_path}"   #? tmux  split left
bind '-' split-window -v -c "#{pane_current_path}"   #? tmux  split down
bind '_' split-window -vb -c "#{pane_current_path}"   #? tmux  split up
unbind '"'
unbind %

# new windows/panes in same directory
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

bind c new-window -c "#{pane_current_path}"   #? tmux  new window in the same dir
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move around panes with hjkl (same as arrows)
bind h select-pane -L   #? tmux  focus pane left
bind j select-pane -D   #? tmux  focus pane down
bind k select-pane -U   #? tmux  focus pane up
bind l select-pane -R   #? tmux  focus pane right

# Use shift + arrow key to move between windows in a session
bind -n S-Left  previous-window   #? tmux  previous window
bind -n S-Right next-window   #? tmux  next window

# resizes, down, up, left, right
bind D resize-pane -D 4   #? tmux  grow pane down
bind U resize-pane -U 4   #? tmux  grow pane up
bind L resize-pane -L 4   #? tmux  grow pane left
bind R resize-pane -R 4   #? tmux  grow pane right

# search
bind-key / copy-mode \; send-key ?   #? tmux  search the scrollback

set-window-option -g status-right '#($HOME/projects/spotify-tmux-applescript/bin/spotify_artist_and_track.applescript) %d/%m/%y %H:%M'

#### PARK — defer a window instead of renaming it
# State lives in the @park window option, never in the window name, so the badge
# survives automatic-rename and the parked windows can be sorted to the right.
# Engine: ~/.config/tmux/scripts/tmux-park.sh (rendering is in the two
# window-status formats above).

# tmux.conf is not a shell, so there is no way to alias the path — but the
# command strings below are handed to sh by run-shell/display-popup, which is
# what expands $HOME.

bind P run-shell "$HOME/.config/tmux/scripts/tmux-park.sh toggle '#{session_name}' '#{window_id}'"   #? park  park / unpark this window
bind N command-prompt -p "park note:" "run-shell \"$HOME/.config/tmux/scripts/tmux-park.sh note '#{session_name}' '#{window_id}' '%%'\""   #? park  set a note on a parked window
# Native tmux menu, not fzf in a popup: tmux draws it and eats the keystrokes
# itself. With mouse on and focus-events on, the terminal's own escape sequences
# reached fzf inside display-popup and read as movement-plus-accept, so the popup
# appeared to close the instant it opened. prefix + C-f still gets the fzf
# version when the parked list is long enough to want fuzzy matching.
bind F run-shell "$HOME/.config/tmux/scripts/tmux-park.sh menu '#{session_name}' '#{client_tty}'"   #? park  parked-window menu
# No '#{session_name}' argument here, unlike the run-shell lines above:
# display-popup does not expand formats in the command it is handed, so the
# script would be passed the literal string. Both popup scripts ask tmux for the
# session themselves.
bind C-f display-popup -E -w 80% -h 60% "$HOME/.config/tmux/scripts/tmux-park.sh picker"   #? park  parked-window fuzzy picker
bind O run-shell "$HOME/.config/tmux/scripts/tmux-park.sh sort '#{session_name}'"   #? park  sort parked windows to the right

# Attention stamps feed the stale detector, and looking at an auto-parked window
# is the same as resuming it — the badge clears itself.
#
# session-window-changed rather than after-select-window: next-window and
# previous-window (S-Left / S-Right above) have no after-* hooks at all, so
# hooking the command would miss most of the ways you actually change window.
set-hook -g session-window-changed "run-shell -b \"$HOME/.config/tmux/scripts/tmux-park.sh touch '#{session_name}' '#{window_id}'\""

# Auto-park windows that have gone quiet. Tunables:
#   @park-stale-mins      minutes of quiet before auto-parking  (0 disables)
#   @park-stale-interval  seconds between sweeps
#   @park-dwell-secs      seconds in a window before a visit counts as attention
#                         (0 = every visit counts, which makes cycling sideways
#                          through windows reset every idle clock it passes)
# Opt one window out for good with:  tmux set -w @park-never 1
set -g @park-stale-mins 45   #? park  minutes quiet before auto-park, 0 disables
set -g @park-dwell-secs 30   #? park  seconds in a window before a visit counts
set -g @park-stale-interval 60   #? park  seconds between stale sweeps
run-shell -b "$HOME/.config/tmux/scripts/tmux-stale.sh start"

#### SNAPSHOT — survive a crash or a reboot
# The window layout only exists in the tmux server's memory, so an Alacritty
# crash is harmless (reattach) but a restart takes everything with it. The
# snapshot daemon mirrors sessions, windows, panes, cwds and the Claude session
# id of each pane to ~/.local/state/tmux-restore, and tmux-restore.sh puts them
# back — resuming the conversations along the way. The Claude ids come from the
# SessionStart hook in ~/.claude/hooks/record-session.sh.
#
# Tunables:
#   @snapshot-interval  seconds between sweeps  (default 60)
#   @snapshot-keep      history files to keep   (default 20)
set -g @snapshot-interval 60   #? restore  seconds between layout snapshots
run-shell -b "$HOME/.config/tmux/scripts/tmux-snapshot.sh start"

#### CLAUDE TAB SEEDER
# Hooks report what a session is doing, but only from the moment they start
# firing, and only for the pane they run in. This fills the two gaps around
# that with facts rather than guesses: a pane whose process tree holds a live
# Claude session but has no state yet is waiting on you, and a pane whose
# session has exited should not keep its last glyph. It never overrules a hook.
# Backgrounded with & inside the shell, not just with run-shell -b. --watch
# loops in the foreground, so run-shell -b keeps it as its own child, and when
# that child is signalled — a pkill, a server shutdown — tmux announces
# "'<command>' terminated by signal 15" in the pane. That message comes from
# tmux itself, so no redirection on the command can suppress it. Detaching with
# & lets the wrapper exit 0 immediately and leaves tmux nothing to report.
run-shell -b "nohup $HOME/.claude/hooks/seed-panes.sh --watch 10 >/dev/null 2>&1 &"

# Every hook below is silenced. `run-shell` shows anything a command prints in
# the pane that triggered it, and the pane opens in view mode waiting for a key
# — so a script that ends with a one-line summary means every new pane greets
# you with its tally and swallows your first keystroke. -b does not change that.

# Reload safety. `set-hook -ga` appends, and sourcing this file again appends
# again, so a few `prefix + r` reloads left five copies of the snapshot hook on
# after-new-window and ran it five times per window. Clearing each event once,
# here, before anything appends to it, makes the whole section idempotent —
# reload as often as you like and the hook list below is what you get.
set-hook -gu after-new-window
set-hook -gu after-split-window
set-hook -gu pane-exited
set-hook -gu window-unlinked
set-hook -gu after-new-session

# The timer is the backstop; these are the moments a pane gains or loses a
# session, so the tab follows immediately instead of up to ten seconds later.
set-hook -ga after-new-window    "run-shell -b \"$HOME/.claude/hooks/seed-panes.sh >/dev/null 2>&1\""
set-hook -ga after-split-window  "run-shell -b \"$HOME/.claude/hooks/seed-panes.sh >/dev/null 2>&1\""
set-hook -ga pane-exited         "run-shell -b \"$HOME/.claude/hooks/seed-panes.sh >/dev/null 2>&1\""

# The timer alone would lose up to a minute of layout changes, and a crash lands
# in that gap more often than it has any right to. These are the events that
# change what a snapshot would say. Appended with -a so the seeder hook set on
# after-new-window above survives — the -gu block up there is what keeps a
# reload from stacking duplicates.
#
# window-unlinked, not after-kill-window: tmux 3.6 has no after-* hook for
# kill-window and rejects the whole config line if you name one.
set-hook -ga after-new-window   "run-shell -b \"$HOME/.config/tmux/scripts/tmux-snapshot.sh snap\""
set-hook -ga window-unlinked    "run-shell -b \"$HOME/.config/tmux/scripts/tmux-snapshot.sh snap\""
set-hook -ga after-new-session  "run-shell -b \"$HOME/.config/tmux/scripts/tmux-snapshot.sh snap\""
# No rename hook on purpose: automatic-rename fires one every time the running
# command changes, and a name is the one field the 60s timer can afford to be
# late on.

# Pull a single lost window back into this session — the "closed the wrong tab"
# case. Whole workspaces go through `tmux-restore restore`, which needs no tmux
# to be running and so belongs on the shell, not on a key.
#
# C-r, not R: R is resize-pane above, and r reloads this file.
bind C-r display-popup -E -w 90% -h 60% "$HOME/.config/tmux/scripts/tmux-restore.sh popup"   #? restore  pull one closed window back into this session

#### COLOUR TUNER — dial the transcript palette without leaving tmux
# claude-color writes ~/.config/claude-color.conf and every running wrapper
# re-reads it within a second, so a colour changed in this popup recolors the
# claude pane underneath while the popup is still open. Fixed cell size, not a
# percentage: the preview block has a natural width and wrapping ruins it.
#
# C, not c: c is new-window above. This shadows tmux's built-in customize-mode,
# which prefix + ? and `tmux customize-mode` both still reach.
bind C display-popup -E -w 84 -h 32 "$HOME/.local/bin/claude-color --tune"   #? claude  tune the transcript palette live

#### CHEAT SHEET — what did I bind this to again
# Every `#?` annotation across these dotfiles, in one fuzzy list. `cheat --new`
# on the shell answers the other half of the question: what did I build lately
# and have not used enough to remember.
#
# ?, shadowing tmux's own list-keys: that screen lists 200 default bindings and
# says nothing about which ones are mine. `tmux list-keys` still reaches it.
bind ? display-popup -E -w 80% -h 70% "$HOME/.local/bin/cheat -i"   #? tmux  this cheat sheet, fuzzy
